<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you — The Fifth Quarter</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C1526">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230C1526'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Marcellus,Georgia,serif' font-size='42' fill='%23D8BC85'%3E5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{--navy-deep:#0C1526;--brass:#B8955A;--gold:#D8BC85;--parchment:#F6F1E4;--dim:#C9C1AC}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;background:var(--navy-deep);color:var(--parchment);font-family:'EB Garamond',Georgia,serif;text-align:center}
  main{max-width:34rem}
  .fm{font-family:'Marcellus',serif;letter-spacing:.2em;color:var(--gold);font-size:1rem}
  h1{font-family:'Marcellus',serif;font-weight:400;font-size:clamp(2rem,6vw,3rem);letter-spacing:.06em;color:var(--gold);margin:1rem 0}
  hr{width:5rem;border:0;border-top:1px solid var(--brass);margin:1.2rem auto}
  p{font-size:1.2rem;color:var(--dim);font-style:italic;line-height:1.6}
  a{display:inline-block;margin-top:2rem;font-family:'Marcellus',serif;letter-spacing:.18em;color:var(--gold);text-decoration:none;border:1px solid var(--brass);padding:.8rem 2rem}
  a:hover{background:rgba(216,188,133,.08)}
</style>
</head>
<body>
<main>
  <div class="fm">THE 5TH QUARTER</div>
  <h1>Thank you</h1>
  <hr>
  <p>Your suggestion has reached us. Every one is read, and some of them will end up on the menu, the shelves or behind the bar.</p>
  <a href="/">Back to The Fifth Quarter</a>
</main>
</body>
</html>
