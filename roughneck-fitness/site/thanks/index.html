<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Barlow:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--steel:#14171A;--orange:#FF6A13;--chalk:#E8E4DC;--mute:#9AA0A8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;font-family:'Barlow',system-ui,sans-serif;color:var(--chalk);background:var(--steel);line-height:1.6}
  main{max-width:36rem}
  .label{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--orange)}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.6rem,8vw,4.5rem);line-height:.95;margin:.8rem 0 1rem}
  p{color:var(--mute);margin-bottom:1.4rem}
  .hazard{height:10px;background:repeating-linear-gradient(135deg,var(--orange) 0 14px,var(--steel) 14px 28px);margin-bottom:1.6rem}
  a{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--chalk);text-decoration:none;border:2px solid var(--orange);padding:.8rem 1.4rem}
  a:hover{background:var(--orange);color:var(--steel)}
</style>
</head>
<body>
<main>
  <div class="hazard"></div>
  <span class="label">Roughneck Fitness</span>
  <h1>Application received.</h1>
  <p>You'll hear back within two working days. If you're on the hitch and the signal's bad, the reply will be by email so it's there when you get to Wi-Fi.</p>
  <a href="/">Back to the site</a>
</main>
</body>
