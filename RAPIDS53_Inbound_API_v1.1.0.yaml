        description: Name of the subunit
          Get the complete list using [/subunit-hierarchy](#/options/subunit-hierarchy)
      what_was_the_system_status:
        type: "string"
        example: "In Operation"
        enum: ["In Operation", "Not in Operation"]
        description:
          Dropdown box used to determine whether the Well Control System (WCS) was ‘In Operation’ or
          ‘Not In Operation’. The WCS is determined to be ‘In Operation’ after the ‘Inline’ BOP Stack
          (‘Stack In Use’) has been latched to the wellhead and the initial subsea testing program specified
          in Section 6.4 of API Standard 53 has been successfully completed. The WCS is determined to be
          ‘Not In Operation’ while the ‘Inline’ BOP Stack, or the ‘Inline’ LMRP, is being run,
          latched to the wellhead, or the lower stack, in the case of the ‘Inline’ LMRP, and the WCS is
          undergoing initial subsea testing. The WCS changes from ‘In Operation’ to ‘Not In Operation’ when
          either the ‘Inline’ BOP Stack is removed from the wellhead (except in Subsea Well Hopping
          situations – see below) or the ‘Inline’ LMRP is removed from the lower stack subsequent to the WCS
          being designated as being ‘In Operation’. Consequently, the WCS is deemed to be ‘Not in Operation’
          when running or retrieving (pulling) the ‘Inline’ BOP Stack or LMRP. In situations where the
          ‘Inline’ BOP Stack is involved in a Subsea Well Hop, the WCS shall continue to be ‘In Operation’
          from the time the previous well is secured, while unlatching from the previous well, during the
          period associated with the transit from the previous well to the subsequent well,
          while it is being latched to the subsequent well and during the performance of the subsea testing
          program for Subsea Well Hops specified in Section 6.4 of API Standard 53.
      usage_amount:
        type: "number"
        example: 35
        description: This provides the usage amount of effected component.
      usage_amount_unit:
        type: "string"
        enum: [Cycle, Hours, Unknown]
        example: "Cycle"
        description: This provides the usage of effected component.
      was_the_last_laboratory_sample_acceptable:
        type: "string"
        example: "yes"
        enum: [yes, no]
        description: This boolean field records the results of the last
          laboratory sample (as opposed to a rig test).
      water_depth:
        type: "string"
        example: "4300"
        description: This gives the level of water when event occurred (value)
      water_depth_unit:
        type: "string"
        example: "Feet"
        enum: [Feet, Meter]
        description: This gives the level of water when event occurred (unit)
      what_maintenance_was_deferred:
        type: "string"
        example: "Annual"
        enum: [Annual, BWM/EOW, Five-Yearly, Quarterly]
        description: The category of maintenance that was deferred
      work_phase:
        type: string
        example: "Maintaining Stack/LMRP on deck"
        enum:
          [
            Disconnecting Stack,
            Disconnecting Stack before well hop,
            Disconnecting Stack/LMRP,
            Drilling Well,
            Hopping Stack between Well,
            Initial Subsea Testing on Well,
            Initial Testing,
            Latching Stack,
            Latching Stack to Well after well hop,
            Latching Stack/LMRP,
            Maintaining Stack,
            Maintaining Stack/LMRP on deck,
            Nippling Down Stack,
            Nippling Down Stack/LMRP,
            Nippling Up Stack,
            Nippling Up Stack/LMRP,
            Retrieving Stack/LMRP,
            Running Stack/LMRP,
            Securing Well,
            Setting back Stack/LMRP on deck,
            Subsea Testing prior to starting new well after well hop,
            Testing BOP Stack (WCS) on Well,
            Maintaining Offline Riser & TJ Components,
            Transporting Stack/LMRP from Set-back area,
          ]
        description:
          This field is used to provide a unique definition of the various phases of operational work that
          the impacted part of the WCS was undergoing at the time of the event and will be utilized to
          categorize unplanned stack-pulls and to estimate equipment usage cycles.
          The dropdown is configured such that it reflects the selections made in connection with the
          ‘What was the system status?’ and ‘Which part of the system was impacted by the event?’ fields.
