# Netlify reads this from the project's base directory.
# Static site: nothing to build, publish this folder as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Internal files in this folder are never served.
[[redirects]]
  from = "/NOTES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/social/*"
  to = "/404.html"
  status = 404
  force = true
