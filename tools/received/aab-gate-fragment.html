      <input type="password" id="pcgatePw" autocomplete="current-password" placeholder="Password" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #d0d8e8;border-radius:4px;font-size:14px;">

        <label for="pcgateRemember" style="margin:0;">Remember on this computer</label>

      <button type="submit" style="margin-top:14px;width:100%;padding:10px;background:#002C77;color:#fff;border:none;border-radius:4px;font-weight:600;font-size:14px;cursor:pointer;">Enter</button>

    </form>

</div>
<script src="gate-config.js"></script>
<script>
(function(){
  var SALT = 'seadrill-bulletin-board-gate|';

  function sha256(str) {
    function rrot(x, n) { return (x >>> n) | (x << (32 - n)); }
    var utf8 = unescape(encodeURIComponent(str));
    var len = utf8.length;
    var bitLen = len * 8;
    var withOne = utf8 + String.fromCharCode(0x80);
    while ((withOne.length % 64) !== 56) withOne += String.fromCharCode(0);
    var hi = Math.floor(bitLen / 0x100000000);
    var lo = bitLen >>> 0;
    var lenBytes = [
      (hi >>> 24) & 0xff, (hi >>> 16) & 0xff, (hi >>> 8) & 0xff, hi & 0xff,
      (lo >>> 24) & 0xff, (lo >>> 16) & 0xff, (lo >>> 8) & 0xff, lo & 0xff
    ];
    for (var b = 0; b < 8; b++) withOne += String.fromCharCode(lenBytes[b]);

    var K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    var H = [
      0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
      0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19
    ];

    var w = new Array(64);
    for (var chunk = 0; chunk < withOne.length; chunk += 64) {
      for (var i = 0; i < 16; i++) {
        var off = chunk + i * 4;
        w[i] = ((withOne.charCodeAt(off) & 0xff) << 24) |
               ((withOne.charCodeAt(off + 1) & 0xff) << 16) |
               ((withOne.charCodeAt(off + 2) & 0xff) << 8) |
               (withOne.charCodeAt(off + 3) & 0xff);
        w[i] = w[i] >>> 0;
      }
      for (var t = 16; t < 64; t++) {
        var s0 = rrot(w[t-15], 7) ^ rrot(w[t-15], 18) ^ (w[t-15] >>> 3);
        var s1 = rrot(w[t-2], 17) ^ rrot(w[t-2], 19) ^ (w[t-2] >>> 10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
      }

      var a=H[0], b2=H[1], c=H[2], d=H[3], e=H[4], f=H[5], g=H[6], h=H[7];
      for (var t2 = 0; t2 < 64; t2++) {
        var S1 = rrot(e,6) ^ rrot(e,11) ^ rrot(e,25);
        var ch = (e & f) ^ (~e & g);
        var temp1 = (h + S1 + ch + K[t2] + w[t2]) >>> 0;
        var S0 = rrot(a,2) ^ rrot(a,13) ^ rrot(a,22);
        var maj = (a & b2) ^ (a & c) ^ (b2 & c);
        var temp2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + temp1) >>> 0;
        d = c; c = b2; b2 = a; a = (temp1 + temp2) >>> 0;
      }
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b2)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }

    var hex = '';
    for (var k = 0; k < 8; k++) hex += ('00000000' + H[k].toString(16)).slice(-8);
    return hex;
  }

  var gate = document.getElementById('pcgate');
  var form = document.getElementById('pcgateForm');
  var pw = document.getElementById('pcgatePw');
  var err = document.getElementById('pcgateErr');
  var rem = document.getElementById('pcgateRemember');
  var hintBtn = document.getElementById('pcgateHintBtn');
  var hintBox = document.getElementById('pcgateHint');
  var cfg = (window.PCGATE || {});

  function key(){ return 'pcgate-unlocked:' + String(cfg.hash || '').slice(0, 12); }

  function unlocked(){
    try{
      var v = localStorage.getItem(key());
      if (!v) return false;
      var exp = Number(v);
      return exp === 0 || exp > Date.now();
    }catch(e){ return false; }
  }

  function openGate(){
    gate.style.display = 'none';
    document.dispatchEvent(new Event('pcgate-unlocked'));
  }

  if (!cfg.hash) {
    err.textContent = 'This page has not been set up yet.';
    hintBox.style.display = 'block';
    hintBox.textContent = 'Contact Technical Services — Well Control to have the password set.';
    pw.disabled = true;
    form.querySelector('button[type=submit]').disabled = true;
  } else if (unlocked()) {
    openGate();
  } else {
    if (cfg.hint) {
      hintBtn.style.display = 'inline';
      hintBtn.onclick = function(){ hintBox.style.display = 'block'; hintBox.textContent = cfg.hint; };
    }
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var h = sha256(SALT + pw.value);
      if (h === cfg.hash) {
        try{ localStorage.setItem(key(), rem.checked ? '0' : String(Date.now() + 12 * 3600 * 1000)); }catch(e){}
        openGate();
      } else {
        err.textContent = 'Incorrect password.';
        pw.value = '';
        pw.focus();
      }
    });
  }
})();
</script>
