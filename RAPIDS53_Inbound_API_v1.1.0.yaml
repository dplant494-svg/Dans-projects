      incident_number:
        type: "string"
        example: "R1617283810146"
        description: Provides the incident number of edited incident.
      bop_control_fluid:
        type: "string"
        example: "Houghton Stack Magic ECO-G"
        description:
          Provides the name of the BOP control fluid in use at the site.
          Get the complete list using [/control-fluids](#/options/control-fluids)
      component_manufacturer_name:
        type: "string"
        example: "NOV"
        description: Provides the name of the Component Manufacturer.
          Get the complete list using [/component-manufacturer](#/options/component-manufacturer)
      component_name:
        type: "string"
        example: "Choke and Kill Valve Operator Sea"
        description: This is the lowest maintainable item that failed.
          Get the complete list using [/subunit-hierarchy](#/options/subunit-hierarchy)
      component_status:
        type: "string"
        example: "OEM - Analysis"
        enum:
          [
            Equipment Owner Repaired,
            Disposal,
            OEM - Analysis,
            OEM - Repair,
            Storage,
            Third Party Analysis,
            Third Party Repair,
          ]
        description: Provides the status of the component where "Storage"
          is returned if the equipment was not sent ashore. If the
          equipment was sent ashore
      concentration:
        type: "string"
        example: "5%"
        enum: [0%, 5%, 10%, 15%, 20%, 25%, 30%, 35%, 40%, 45%, 50%, 55%, 60%]
        description: Percentage of control fluid concentrate in the mixture.
      date_affected_component_was_installed:
        type: "string"
        example: "MMM DD,YYYY e.g.: Sep 08, 2018"
        description: Provides the name of Drilling Contractor / Equipment
          Owner
      date_of_last_laboratory_sample:
        type: "string"
        example: "MMM DD, YYYY e.g.: Sep 08, 2018"
        description: This is a date field that records the date when the
          affected component was installed into the system on
          the rig. This could be the date that the equipment was
          delivered, or it could be after a major
          inspection/maintenance (e.g.five-yearly).
      date_of_last_maintenance:
        type: "string"
        example: "MMM DD,YYYY e.g.: Sep 08, 2018"
        description: This field records the date of the last laboratory
          analysis.
      desc_well_control_system_status:
        type: "string"
        example: ""
        description:
          Describe what was happening operationally from an overall WCS-perspective at the time the
          event occurred, complete with information on the statuses of all the BOP stacks on the rig.
      desc_ongoing_wcs_related_work:
        type: "string"
        example: ""
        description:
          Describe the WCS tasks that were being performed by, or on, the equipment (subunit/item
          /component) at the center of the event at the time the event occurred.
      desc_malfunction:
        type: "string"
        example: ""
        description:
          Describe how it was determined that the component at the center of the event was not
          performing as required.
      desc_problem_isolation:
        type: "string"
        example: ""
        description:
          Describe the steps taken to either (a) prevent the problem from escalating, preserve the
          integrity of the WCS and allow the ongoing operations/WCS tasks to be completed as intended
          or (b) discontinue ongoing operations/WCS tasks, troubleshoot the problem and eliminate the
          problem such that the ongoing operations/WCS tasks could be completed as originally intended.
      desc_assumed_cause:
        type: "string"
        example: ""
        description:
          Describe the initial assumptions that were made with regard to what caused the component at
          the center of the event to fail to perform as required.
      desc_initial_remedy:
        type: "string"
        example: ""
        description:
          Describe the immediate steps taken to rectify the problem, stemming from the malfunction of
          the component at the center of this event, based on the assumptions made about the initial
          cause.
      desc_investigations_performed:
        type: "string"
        example: ""
        description:
          Describe the investigative actions taken to confirm the assumed root cause or establish a
          credible root cause.
      desc_summary_of_findings:
        type: "string"
        example: ""
        description: Provide a summary of what was found as a result of performing the investigations.
      desc_support_for_root_cause_selection:
        type: "string"
        example: ""
        description:
          Provide a description of the established root cause in a manner that supports the value
          assigned in the ‘Root Cause’ field.
      desc_lessons_learned_summary:
        type: "string"
        example: ""
        description:
          Describe the actions to be taken in an effort to eliminate the malfunction or at least reduce
          the likelihood of a repeat occurrence of the malfunction.
      description_of_last_completed_maintenance:
