# Netlify reads this from the project's base directory.
# Static site: nothing to build, publish this folder as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Short links for print, WhatsApp and Instagram. Order matters: first match wins.
[[redirects]]
  from = "/whatsapp"
  to = "https://wa.me/34722676631"
  status = 302

[[redirects]]
  from = "/wa"
  to = "https://wa.me/34722676631"
  status = 302

[[redirects]]
  from = "/precios"
  to = "/es/#packages"
  status = 302

[[redirects]]
  from = "/prices"
  to = "/#packages"
  status = 302

[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

# Old demo path, in case it was ever shared
[[redirects]]
  from = "/demo/*"
  to = "/work/:splat"
  status = 301

# Internal files in this folder are never served.
[[redirects]]
  from = "/work/README.md"
  to = "/404.html"
  status = 404
  force = true
