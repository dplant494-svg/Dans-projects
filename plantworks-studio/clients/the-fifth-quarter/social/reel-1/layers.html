<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0C1526;--brass:#B8955A;--gold:#D8BC85;--parch:#F6F1E4;--dim:#C9C1AC}
body{background:transparent}
.card{width:1080px;height:1920px;position:relative;background:var(--navy);overflow:hidden;color:var(--parch)}
.c{position:absolute;left:0;right:0;text-align:center}
.mar{font-family:'Marcellus',serif}
.gar{font-family:'EB Garamond',serif}
.rule{position:absolute;left:50%;height:2px;background:var(--brass);transform:translateX(-50%)}
#end .seam{position:absolute;left:0;right:0;height:14px}
</style></head><body>
<div class="card" id="bg">
  <div class="c mar" style="top:250px;font-size:62px;letter-spacing:.14em;color:var(--gold)">THE 5<span style="font-size:.62em;vertical-align:.55em;letter-spacing:.06em">TH</span> QUARTER</div>
  <div class="c gar" style="top:338px;font-size:28px;letter-spacing:.34em;color:var(--dim)">BENEATH OUR FEET</div>
  <div class="rule" style="top:392px;width:120px"></div>
  <div class="c gar" style="top:1238px;font-size:42px;font-style:italic;color:var(--parch)">Something extra, beneath your feet.</div>
  <div class="c mar" style="top:1312px;font-size:25px;letter-spacing:.3em;color:var(--brass)">LIONS GATE · LAMBTON PARK</div>
</div>
<div class="card" id="end">
  <div class="c mar" style="top:470px;font-size:44px;letter-spacing:.4em;color:var(--gold)">THE</div>
  <div class="c mar" style="top:540px;font-size:190px;line-height:1;color:var(--gold)">5<span style="font-size:.42em;vertical-align:.95em">TH</span></div>
  <div class="c mar" style="top:745px;font-size:128px;line-height:1;letter-spacing:.04em;color:var(--gold)">QUARTER</div>
  <div class="c mar" style="top:905px;font-size:38px;letter-spacing:.32em;color:var(--parch)">RESTAURANT &amp; BAR</div>
  <div class="c gar" style="top:975px;font-size:36px;color:var(--dim)">Breakfast · Lunch · Dinner · Delicatessen</div>
  <div class="rule" style="top:1062px;width:160px"></div>
  <div class="c mar" style="top:1100px;font-size:30px;letter-spacing:.3em;color:var(--brass)">LIONS GATE, LAMBTON PARK</div>
  <div class="c mar" style="top:1170px;font-size:52px;letter-spacing:.22em;color:var(--parch)">COMING SPRING 2027</div>
  <div class="seam" style="top:1400px;background:#1C2433"></div>
  <div class="seam" style="top:1420px;background:#141B29;height:22px"></div>
  <div class="seam" style="top:1450px;background:var(--gold);height:6px;opacity:.85"></div>
  <div class="seam" style="top:1464px;background:#1C2433;height:26px"></div>
  <div class="seam" style="top:1498px;background:#111827;height:12px"></div>
  <div class="c gar" style="top:1520px;font-size:24px;letter-spacing:.3em;color:var(--brass)">FIVE QUARTER · SEAM G</div>
</div>
</body></html>
